<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic ArqComp - Cruzadinha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">

<span>Anéis Coletados (Acertos): <strong id="span_acertos">0</strong> de 13 palavras</span>
</div>
</div>

<div class="container">

<div class="botoes">

<button onclick="reiniciar()" class="btn-reiniciar">Reiniciar</button>
</div>
</div>

<div class="pistas-area">
<div class="bloco-pistas">
<h2>HORIZONTAIS</h2>
<ul id="lista_horizontais"></ul>
</div>
<div class="bloco-pistas">
<h2>VERTICAIS</h2>
<ul id="lista_verticais"></ul>
</div>
</div>
</div>

<script src="script.js"></script>

</html>
