<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cruzadinha de Arquitetura Computacional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Cruzadinha de Arquitetura Computacional</h1>
    <p class="sub">Descubra os 16 termos lendo as pistas e digitando uma letra por casa.</p>
  </header>

  <main>
    <section class="painel controles" aria-label="Controles do jogo">
      <button id="btn-conferir" type="button">Conferir</button>
      <button id="btn-reiniciar" type="button" class="secundario">Reiniciar</button>
      <p id="contador" class="contador" aria-live="polite">0 de 16 palavras corretas</p>
    </section>

    <section class="painel tabuleiro-wrap" aria-label="Tabuleiro">
      <div id="tabuleiro" class="tabuleiro" role="grid"></div>
    </section>

    <section class="pistas">
      <div class="painel">
        <h2>Horizontais</h2>
        <ol id="pistas-h"></ol>
      </div>
      <div class="painel">
        <h2>Verticais</h2>
        <ol id="pistas-v"></ol>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <p>Atividade Avaliativa III – Arquitetura Computacional</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
